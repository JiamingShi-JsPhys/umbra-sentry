[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "umbra-sentry"
version = "1.0.0"
description = "Semantic-layer defense pipeline that hardens release artifacts against AI reverse-engineering agents."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "JiamingShi-JsPhys" }]
keywords = ["security", "hardening", "anti-reverse-engineering", "ocsf", "sigma", "defense"]
# The package imports both at runtime (core/models.py, adapters/*) but never
# declared them: a clean `pip install .` produced a CLI that raised
# ModuleNotFoundError on first use.
dependencies = ["pydantic>=2.7", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
umbra-harden = "cli:main"

[tool.hatch.build.targets.wheel]
# `packages` alone excludes the top-level cli.py, so the `umbra-harden`
# console script raised ModuleNotFoundError in a non-editable install.
only-include = ["core", "defense", "adapters", "response", "gates", "cli.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
